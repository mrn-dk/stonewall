<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stonewall</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong one. An explicit choice under 'stonewall.theme' wins; otherwise
      // follow the OS. $lib/theme.svelte.js owns the attribute after hydration.
      (function () {
        try {
          var saved = localStorage.getItem('stonewall.theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
